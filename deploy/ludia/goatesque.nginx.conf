# Goatesque only; no changes to other virtual hosts.
server {
    listen 80;
    listen [::]:80;
    server_name goatesque.mrinmoy.org;
    root /var/www/goatesque/current;
    index index.html;
    client_max_body_size 24k;
    add_header X-Content-Type-Options nosniff always;
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json;

    location = /api/rooms/socket {
        proxy_pass http://127.0.0.1:8792;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 75s;
        proxy_connect_timeout 2s;
        proxy_buffering off;
    }
    location = /api/rooms {
        proxy_pass http://127.0.0.1:8792;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 10s;
        proxy_connect_timeout 2s;
        add_header Cache-Control "no-store" always;
    }
    location = /api/health {
        proxy_pass http://127.0.0.1:8792;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location ~ /\. { deny all; }
    location ~ ^/game/assets/atlas-[0-9]+-[a-f0-9]+\.png$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~ \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
